{% extends "base.html" %}
{% block title %}New partner · Admin{% endblock %}
{% block body %}
<a class="back" href="{{ url_for('admin.overview') }}">← Back</a>
<h1>Onboard a new partner</h1>
<p class="page-sub">Creates the partner, a dashboard login, and a first API key.</p>

<form method="post" class="panel" style="padding:22px">
  <div class="form-grid">
    <div><label>Partner name *</label><input name="name" required></div>
    <div><label>Business email</label><input type="email" name="email"></div>
    <div><label>Dashboard login email *</label><input type="email" name="login_email" required></div>
    <div><label>Dashboard password *</label><input type="text" name="password" required></div>
    <div class="full"><label>Result webhook URL (optional)</label>
      <input name="webhook_url" placeholder="https://partner.com/webhooks/dmoney"></div>
  </div>
  <button class="btn" type="submit" style="margin-top:20px">Create partner</button>
</form>
{% endblock %}
