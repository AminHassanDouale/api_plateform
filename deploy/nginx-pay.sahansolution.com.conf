# nginx vhost for pay.sahansolution.com -> gunicorn (D-Money platform)
# Port 80 only; `certbot --nginx` will add the TLS (443) server block + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name pay.sahansolution.com;

    access_log /var/log/nginx/pay.sahansolution.com.access.log;
    error_log  /var/log/nginx/pay.sahansolution.com.error.log;

    # Checkout URLs and webhook payloads are small; cap body size.
    client_max_body_size 2m;

    location / {
        proxy_pass http://unix:/run/gunicorn-dmoney/pay.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
